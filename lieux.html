<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Sélection de lieux · Rumeur</title>
<style>
:root{
  --bg:#FFFFFF; --tile:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --line:#D2D2D7; --accent:#0071E3; --heart:#E0245E;
  --logo-filter:none; --shade:rgba(0,0,0,.55);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.in{padding:0 32px}}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.top img{height:17px;filter:var(--logo-filter);display:block}
.top .contact{font-size:14px;color:var(--muted)}
.hero{padding:56px 0 30px}
.eyebrow{font-size:14px;color:var(--muted);margin:0 0 10px;font-weight:500}
h1{font-size:clamp(34px,6vw,64px);line-height:1.03;letter-spacing:-.035em;margin:0;font-weight:700;max-width:18ch}
.intro{font-size:clamp(18px,2.1vw,22px);line-height:1.4;color:var(--muted);max-width:46ch;margin:18px 0 0;white-space:pre-line}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:34px 0 18px;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;background:var(--tile);border-radius:980px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:980px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* Grille */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:34px 22px;padding-bottom:40px}
.card{display:block;text-align:left;border:0;background:none;padding:0;cursor:pointer;width:100%}
.ph{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--tile)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease,opacity .4s ease}
.ph img:not([src]){opacity:0}
.card:hover .ph img{transform:scale(1.025)}
.num{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:600;border-radius:980px;padding:3px 10px;backdrop-filter:blur(6px)}
.nph{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:980px;padding:3px 9px}
.cardt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:12px}
.cardt h2{font-size:21px;line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:600}
.cardt p{margin:3px 0 0;color:var(--muted);font-size:15px}
.price{font-size:14px;font-weight:600;white-space:nowrap;margin-top:3px}
.heart{border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:14px;padding:4px 2px}
.heart svg{width:20px;height:20px}
.heart.on{color:var(--heart)}
.heart.on svg path{fill:currentColor}
/* Vue détaillée */
.long{display:grid;gap:64px;padding-bottom:40px}
.lrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
.lrow .mos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lrow .mos .ph{aspect-ratio:4/3;border-radius:10px;cursor:zoom-in}
.lrow .mos .ph:first-child{grid-column:1/-1;aspect-ratio:16/10}
.info h2{font-size:clamp(26px,3vw,34px);line-height:1.1;margin:0;letter-spacing:-.03em}
.info .zone{color:var(--muted);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.chip{background:var(--tile);border-radius:980px;padding:6px 12px;font-size:14px}
.chip b{font-weight:600}
.desc{margin:16px 0 0;white-space:pre-line}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:18px 0 0;font-size:15px}
dt{color:var(--muted)}dd{margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;margin:18px 0 0;font-size:15px}
.acts{display:flex;align-items:center;gap:14px;margin:20px 0 0;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:980px;padding:8px 16px;cursor:pointer;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big-heart{display:inline-flex;align-items:center;gap:8px}
.btn.big-heart svg{width:18px;height:18px}
.btn.big-heart.on{color:var(--heart);border-color:var(--heart)}
.btn.big-heart.on svg path{fill:currentColor}
.comments{margin:26px 0 0;border-top:1px solid var(--line);padding-top:18px}
.comments h3{font-size:16px;margin:0 0 10px}
.com{margin:0 0 12px;font-size:15px}
.com b{font-weight:600}.com span{color:var(--muted);font-size:13px}
.cform{display:grid;gap:8px;margin-top:8px}
.cform input,.cform textarea{font:400 16px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.cform textarea{min-height:76px;resize:vertical}
/* Fiche lieu (plein écran) */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-h{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.sheet-h .in{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
.sheet-h .nav{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.ib{border:0;background:var(--tile);width:38px;height:38px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;font-size:20px;line-height:1}
.ib:disabled{opacity:.35;cursor:default}
.sheet-b{padding-top:24px;padding-bottom:60px}
.gal .main{aspect-ratio:16/10;border-radius:16px;cursor:zoom-in}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:thin}
.strip button{flex:none;border:0;padding:0;width:96px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--tile);opacity:.6}
.strip button[aria-current="true"]{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.sgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:900px){.lrow,.sgrid{grid-template-columns:1fr}.long{gap:48px}}
/* Visionneuse */
.lb{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100vw;max-height:100dvh;object-fit:contain}
.lb .ib{position:absolute;background:rgba(255,255,255,.14);color:#fff}
.lb .x{top:max(14px,env(safe-area-inset-top,0px));right:14px}
.lb .p{left:12px;top:50%}.lb .n{right:12px;top:50%}
.lb .cnt{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#ccc;font-size:14px}
footer{border-top:1px solid var(--line);margin-top:30px;padding:28px 0 calc(40px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:14px}
footer .in{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.state{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px 20px}
.state h1{color:var(--ink);font-size:32px;margin:0 auto 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:980px;font-size:14px;z-index:40}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* DA Rumeur : sobre */
.cardt h2{font-size:16px;font-weight:500;letter-spacing:-.01em}
.cardt p{font-size:13px}
.price{background:none;padding:0;font-size:13px}
.intro{font-size:16px;line-height:1.5;max-width:56ch}
.info h2{font-size:clamp(22px,2.4vw,28px);font-weight:500;letter-spacing:-.02em}
.info .zone{font-size:14px}
.desc{font-size:15px}
dl{font-size:14px}
.links{font-size:14px}
.bar{font-size:13px}
.num{background:rgba(255,255,255,.92);color:#141414;font-weight:500;font-size:12px}
.nph{font-size:11px}
.ph{border-radius:10px}
.comments h3{font-size:14px;font-weight:500}
.com{font-size:14px}
.top{background:rgba(246,246,244,.86)}
footer{font-size:13px}
.state h1{font-size:26px;font-weight:500}
</style>
<link rel="stylesheet" href="theme.css?v=4">
</head>
<body>
<div id="app"><div class="state"><div>Chargement de la sélection…</div></div></div>
<script src="config.js?v=2"></script>
<script src="lieux.js?v=2"></script>
</body>
</html>
